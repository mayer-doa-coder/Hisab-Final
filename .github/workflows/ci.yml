name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      # Bangla and English string keys must match — Step 10.
      # Invoked via `bash` (not ./scripts/...) so it doesn't depend on the
      # executable bit surviving a checkout from a Windows dev machine.
      - name: Localization completeness
        working-directory: .
        run: bash scripts/check-localization.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Install nothing here, on purpose. This action's default for
          # `packages` is "tools platform-tools", and Google has stopped
          # serving the legacy `tools` package — a missing package is fatal to
          # sdkmanager, so the action fails inside itself before any step of
          # ours runs ("Warning: Failed to find package 'tools'", exit code 1).
          # Nothing in this build needs `tools`: it is the old standalone SDK
          # tools bundle, replaced by cmdline-tools, which the action installs
          # regardless of this input. Everything we actually need is named and
          # pinned in the next step instead, in one place.
          packages: ''

      - name: Install SDK platform and build-tools
        # Versions pinned to match DECISIONS.md D025 (compileSdk 36).
        # platform-tools is listed here because the step above no longer
        # installs it — see the comment there.
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v6

      # This repo is developed on Windows, where git has core.fileMode=false
      # and drops the executable bit. Without this, ./gradlew fails on the
      # Linux runner with "Permission denied".
      - name: Make gradlew executable
        run: chmod +x gradlew

      # "Android compile" — Step 4. assembleDebug builds the installable APK
      # (which includes compiling), so CI proves the app can actually be
      # built, not just that the Kotlin compiles. The on-phone tests can't run
      # here (no phone), but compiling them catches a broken test file early.
      - name: Compile
        run: ./gradlew assembleDebug compileDebugAndroidTestKotlin

      # Step 31: run after the build, which re-exports the Room schema, so a
      # schema changed without a matching migration fails here.
      - name: Room schema and migrations
        working-directory: .
        run: bash scripts/check-room-schema.sh

      # "Android unit tests" — Step 4
      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      # "Lint" — Step 4 (AGP's built-in lint + Spotless code style)
      - name: Lint
        run: ./gradlew lintDebug spotlessCheck

  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # A throwaway Postgres for this run only (Step 29). Local connections are
    # trusted, so there is no password here or anywhere else in the repo.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: hisab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/hisab_test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # "Server compile" — Step 4
      - name: Compile
        run: npm run build

      # Step 29: the migrations must run cleanly on an empty database. This
      # step proves that on every push, because the container starts empty.
      - name: Database migrations
        run: npm run migrate

      # "Server unit tests" — Step 4. The test pattern in package.json is
      # quoted on purpose: unquoted, Linux `sh` expands `dist/**/*.test.js`
      # only one folder deep, and CI silently ran 21 of 64 tests (found at
      # Step 22). Quoted, Node expands it and finds every test file.
      - name: Unit tests
        run: npm test

      # "Lint" — Step 4 (ESLint + Prettier)
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
