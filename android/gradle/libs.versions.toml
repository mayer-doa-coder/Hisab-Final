[versions]
agp = "9.4.0"
kotlin = "2.4.10"
composeBom = "2026.03.01"
coreKtx = "1.16.0"
lifecycleRuntimeKtx = "2.9.1"
activityCompose = "1.11.0"
appcompat = "1.8.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
spotless = "8.10.2"
ksp = "2.3.12"
room = "2.8.5"
# Only to settle a version clash: lifecycle pulls kotlinx-serialization 1.7.3,
# Room 2.8.5's schema bundles need 1.8.1, and Gradle's consistent resolution
# pushed 1.7.3 into the test classpath — where the migration test then died
# with AbstractMethodError. The BOM lines both up.
kotlinxSerialization = "1.8.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
# Screen state that survives the Activity being recreated — which happens on
# every language switch (D014), not just on rotation.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# Needed for per-app language switching below API 33 (D014).
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
kotlinx-serialization-bom = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-bom", version.ref = "kotlinxSerialization" }

[plugins]
# No kotlin-android plugin: AGP 9's built-in Kotlin support replaces it.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Not org.jlleitschuh.gradle.ktlint: that plugin can't find Kotlin source
# sets under AGP 9's built-in Kotlin mode (open upstream bug, ktlint-gradle#1008
# — confirmed empirically, not just from the issue tracker). Spotless targets
# files by glob instead of relying on Kotlin-plugin source-set detection, so
# it isn't affected by the same bug.
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
# KSP: annotation processor for Room. Versioned independently of Kotlin
# since KSP2 (own release train, not <kotlin>-<ksp> pairing) — see the KSP
# release notes if this ever needs bumping alongside a Kotlin upgrade.
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
